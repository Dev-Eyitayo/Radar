name: Radar Opportunity Scanner

on:
  schedule:
    # Runs twice daily: 06:00 UTC (07:00 AM West Africa Time) and 14:00 UTC (03:00 PM WAT)
    - cron: '0 6,14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  scan_and_alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Radar Scanner & Dispatch Alerts
        env:
          EMAIL_BASE_URL: ${{ secrets.EMAIL_BASE_URL || 'https://api.sendbyte.africa' }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM_EMAIL: ${{ secrets.EMAIL_FROM_EMAIL || 'radar@eyitayo.online' }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME || 'Radar Opportunities' }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL || 'ezekieleyitayo2020@gmail.com' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENFORCE_NO_NYSC_ONLY: "True"
        run: |
          python run.py

      - name: Commit & Push Updated State
        run: |
          git config user.name "Radar Bot"
          git config user.email "radar-bot@eyitayo.online"
          git add data/seen_opportunities.json data/latest_digest.json
          git diff-index --quiet HEAD || git commit -m "chore(radar): update opportunities digest & seen database [skip ci]"
          git push
